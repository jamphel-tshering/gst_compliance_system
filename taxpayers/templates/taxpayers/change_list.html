{% extends "admin/change_list.html" %}

{% block extrahead %}
{{ block.super }}
<style>
    /* Ultra-compact layout to prevent scrolling issues */
    .paginator {
        padding: 3px 0 !important;
        font-size: 10px !important;
        white-space: nowrap !important;
        overflow-x: auto !important;
    }
    
    .paginator .paginator-page, 
    .paginator .paginator-ellipsis {
        padding: 1px 3px !important;
        font-size: 10px !important;
        margin: 0 1px !important;
    }
    
    .paginator .prev, 
    .paginator .next {
        padding: 1px 5px !important;
        font-size: 10px !important;
    }
    
    /* Compact toolbar */
    .object-tools {
        margin-bottom: 2px !important;
    }
    
    /* Reduce all spacing */
    .module {
        margin-bottom: 5px !important;
    }
    
    /* Compact table */
    #result_list {
        font-size: 11px !important;
    }
    
    #result_list th, #result_list td {
        padding: 3px 6px !important;
    }
    
    /* Prevent horizontal overflow */
    .changelist-table-container {
        overflow-x: auto !important;
    }
    
    /* Custom date range filter */
    .date-range-filter {
        background: #f8f9fa;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 4px;
        border: 1px solid #dee2e6;
    }
    
    .date-range-filter label {
        font-weight: 500;
        margin-right: 5px;
    }
    
    .date-range-filter input[type="date"] {
        padding: 4px 8px;
        border: 1px solid #ced4da;
        border-radius: 4px;
        margin-right: 10px;
    }
    
    .date-range-filter button {
        padding: 4px 12px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
</style>
<script>
function applyDateFilter() {
    var startDate = document.getElementById('reg_start_date').value;
    var endDate = document.getElementById('reg_end_date').value;
    
    // Get current URL parameters
    var urlParams = new URLSearchParams(window.location.search);
    
    // Add or update date parameters
    if (startDate) {
        urlParams.set('reg_start_date', startDate);
    } else {
        urlParams.delete('reg_start_date');
    }
    
    if (endDate) {
        urlParams.set('reg_end_date', endDate);
    } else {
        urlParams.delete('reg_end_date');
    }
    
    // Redirect with new parameters
    window.location.href = window.location.pathname + '?' + urlParams.toString();
}
</script>
{% endblock %}

{% block content %}
{# Taxpayer Summary Panel - Top of page #}
{% if summary_html %}
<div style="margin: 0 0 10px 0;">
    {{ summary_html|safe }}
</div>
{% endif %}

{# Custom Date Range Filter #}
<div class="date-range-filter">
    <label>Filter by Registration Date:</label>
    <input type="date" id="reg_start_date" value="{{ request.GET.reg_start_date|default:'' }}">
    <label>to:</label>
    <input type="date" id="reg_end_date" value="{{ request.GET.reg_end_date|default:'' }}">
    <button type="button" onclick="applyDateFilter()">Apply Filter</button>
    <a href="./" style="margin-left: 10px; text-decoration: none;">Clear Filter</a>
</div>

{{ block.super }}
{% endblock %}
