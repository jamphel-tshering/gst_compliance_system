{% extends "admin/change_list.html" %}

{% block extrahead %}
{{ block.super }}
<style>
    /* Make all columns wider to display full data */
    #result_list th, #result_list td {
        white-space: normal !important;
        max-width: none !important;
        padding: 8px 12px !important;
    }
    
    /* Make specific columns wider */
    #result_list th:nth-child(1), /* GSTIN */
    #result_list td:nth-child(1) {
        min-width: 120px;
    }
    
    #result_list th:nth-child(2), /* RAMIS TPN */
    #result_list td:nth-child(2) {
        min-width: 120px;
    }
    
    #result_list th:nth-child(3), /* Taxpayer Name */
    #result_list td:nth-child(3) {
        min-width: 200px;
    }
    
    #result_list th:nth-child(4), /* Business Name */
    #result_list td:nth-child(4) {
        min-width: 200px;
    }
    
    #result_list th:nth-child(18), /* Business Address */
    #result_list td:nth-child(18) {
        min-width: 300px;
        max-width: 400px;
    }
    
    #result_list th:nth-child(19), /* Remarks */
    #result_list td:nth-child(19) {
        min-width: 250px;
        max-width: 350px;
    }
    
    /* Make table scrollable horizontally if needed */
    .results {
        overflow-x: auto;
    }
    
    #result_list {
        min-width: 100%;
    }
    
    /* Hide filter counts using CSS */
    .filter-choices li a::after {
        display: none;
    }
</style>
{% endblock %}
