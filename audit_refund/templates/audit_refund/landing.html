{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}
<div style="max-width: 1200px; margin: 0 auto; padding: 40px 20px;">
    <h1 style="text-align: center; color: #2c5282; margin-bottom: 40px;">Audit & Refund Module</h1>
    
    <div style="display: flex; gap: 40px; justify-content: center; flex-wrap: wrap;">
        <!-- Audit Module -->
        <div style="flex: 1; min-width: 300px; max-width: 500px;">
            <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 12px; padding: 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); transition: transform 0.3s, box-shadow 0.3s;" onmouseover="this.style.transform='translateY(-5px)'; this.style.boxShadow='0 15px 40px rgba(0,0,0,0.15)';" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 10px 30px rgba(0,0,0,0.1)';">
                <h2 style="color: white; margin: 0 0 20px 0; font-size: 28px;">AUDIT</h2>
                <p style="color: rgba(255,255,255,0.9); margin: 0 0 30px 0; font-size: 16px;">Audit Cases</p>
                <a href="{% url 'audit_refund:audit_dashboard' %}" style="display: inline-block; background: white; color: #667eea; padding: 12px 30px; border-radius: 6px; text-decoration: none; font-weight: bold; transition: background 0.3s;" onmouseover="this.style.background='#f0f0f0';" onmouseout="this.style.background='white';">
                    Go to Audit Dashboard
                </a>
            </div>
        </div>
        
        <!-- Refund Module -->
        <div style="flex: 1; min-width: 300px; max-width: 500px;">
            <div style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); border-radius: 12px; padding: 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); transition: transform 0.3s, box-shadow 0.3s;" onmouseover="this.style.transform='translateY(-5px)'; this.style.boxShadow='0 15px 40px rgba(0,0,0,0.15)';" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 10px 30px rgba(0,0,0,0.1)';">
                <h2 style="color: white; margin: 0 0 20px 0; font-size: 28px;">REFUND</h2>
                <p style="color: rgba(255,255,255,0.9); margin: 0 0 30px 0; font-size: 16px;">Refund Cases</p>
                <a href="{% url 'audit_refund:refund_dashboard' %}" style="display: inline-block; background: white; color: #f5576c; padding: 12px 30px; border-radius: 6px; text-decoration: none; font-weight: bold; transition: background 0.3s;" onmouseover="this.style.background='#f0f0f0';" onmouseout="this.style.background='white';">
                    Go to Refund Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
