<!DOCTYPE html>
<html>
<head>
    <title>GST Compliance System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .button {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
            transition: background 0.3s;
        }
        .button:hover {
            background: #5568d3;
        }
        .note {
            color: #666;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GST Compliance System</h1>
        <a href="http://localhost:8888" class="button">Open Main System</a>
        <a href="http://localhost:8888/admin/" class="button">Open Admin Panel</a>
        <p class="note">
            <strong>Note:</strong> If you see SSL errors, your browser is trying to use HTTPS.
            These links use HTTP which is correct for local development.
        </p>
    </div>
</body>
</html>
