{% load i18n %}
<div class="portlet light bordered">
    <div class="portlet-title">
        <div class="caption">
            <i class="icon-pie-chart font-dark"></i>
            <span class="caption-subject font-dark bold uppercase">Taxpayers by Dzongkhag</span>
        </div>
    </div>
    <div class="portlet-body">
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>Dzongkhag</th>
                    <th>Count</th>
                </tr>
            </thead>
            <tbody>
                {% for item in dzongkhag_data %}
                <tr>
                    <td>{{ item.dzongkhag }}</td>
                    <td>{{ item.count }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
