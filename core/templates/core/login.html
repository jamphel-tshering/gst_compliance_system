{% extends 'core/base.html' %}

{% block content %}
<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.login-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(5px);
}

.login-dialog {
    background: white;
    border-radius: 16px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    overflow: hidden;
    max-width: 480px;
    width: 90%;
    animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.login-header {
    background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
    color: white;
    padding: 35px 40px;
    text-align: center;
    position: relative;
}

.login-header::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
    opacity: 0.3;
}

.login-header h2 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    position: relative;
    z-index: 1;
}

.login-header p {
    margin: 8px 0 0 0;
    font-size: 14px;
    opacity: 0.9;
    position: relative;
    z-index: 1;
}

.login-body {
    padding: 45px 40px;
}

.form-group {
    margin-bottom: 28px;
}

.form-group label {
    display: block;
    margin-bottom: 10px;
    font-weight: 600;
    color: #333;
    font-size: 14px;
    letter-spacing: 0.3px;
}

.form-control {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 15px;
    transition: all 0.3s ease;
    background: #f8f9fa;
}

.form-control:focus {
    border-color: #1a237e;
    background: white;
    box-shadow: 0 0 0 4px rgba(26, 35, 126, 0.1);
    outline: none;
}

.btn-login {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

.btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(26, 35, 126, 0.4);
}

.login-footer {
    text-align: center;
    padding: 25px 40px;
    background: #f8f9fa;
    border-top: 1px solid #e0e0e0;
}

.login-footer p {
    margin: 0;
    font-size: 13px;
    color: #666;
    font-weight: 500;
}

.close-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    transition: all 0.3s ease;
    z-index: 2;
}

.close-btn:hover {
    background: rgba(255,255,255,0.3);
}
</style>

<div class="login-overlay">
    <div class="login-dialog">
        <div class="login-header">
            <button class="close-btn" onclick="window.location.href='/'">×</button>
            <h2>RRCO/GST Mongar Administration</h2>
            <p>GST Compliance System</p>
        </div>
        <div class="login-body">
            <form method="post" action="/login/">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Username</label>
                    <input type="text" class="form-control" name="username" id="id_username" required placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="id_password">Password</label>
                    <input type="password" class="form-control" name="password" id="id_password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn-login">Login</button>
            </form>
        </div>
        <div class="login-footer">
            <p>Revenue and Customs Division, Bhutan</p>
        </div>
    </div>
</div>
{% endblock %}
